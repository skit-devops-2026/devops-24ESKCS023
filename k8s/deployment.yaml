apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-library-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
    containers:
    - name: server
      image: digital-library-server:latest
      ports:
      - containerPort: 5000