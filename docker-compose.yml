services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      - MONGO_URI=mongodb://mongo:27017/digital_library
      - PORT=5000
    ports: ["5000:5000"]

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8085:80"]

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    depends_on: [server]

  grafana:
    image: grafana/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  mongo_data: