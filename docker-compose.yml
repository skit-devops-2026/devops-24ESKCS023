services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      - MONGO_URI=mongodb://mongo:27017/digital_library
      - PORT=5000
    ports: ["5000:5000"]

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  mongo_data: