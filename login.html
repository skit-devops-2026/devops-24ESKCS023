<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Digital Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">📚 Digital Library</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>

  <!-- Login Form -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue to your library</p>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com">
          <span class="error-text" id="login-email-error"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password">
          <span class="error-text" id="login-password-error"></span>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2026 Digital Library. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
